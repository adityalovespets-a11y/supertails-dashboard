name: Daily dashboard refresh

# Runs every day at 23:00 UTC (= 04:30 IST next morning).
# This is after the BigQuery → Sheet job (04:00 IST) so install data is fresh.
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:        # also allow manual trigger from the Actions tab

permissions:
  contents: write           # so the runner can push the regenerated dashboard back

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore service-account credentials from secret
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret GCP_SERVICE_ACCOUNT_JSON is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > gsc_service_account.json
          echo "✓ Service account written ($(wc -c < gsc_service_account.json) bytes)"

      - name: Run fetch_signals.py
        run: python fetch_signals.py
        continue-on-error: true   # commit partial progress even if one signal fails

      - name: Remove credentials before commit
        if: always()
        run: rm -f gsc_service_account.json

      - name: Commit and push refreshed dashboard
        run: |
          git config user.name  "supertails-bot"
          git config user.email "supertails-bot@users.noreply.github.com"
          git add data_store.json supertails_dashboard.html config.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit — dashboard already up to date."
            exit 0
          fi
          git commit -m "auto-refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
